<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary SEO Meta Tags -->
    <title>PromoGames — Quick Games. Real Rewards. | No-Code Gamification Platform</title>
    <meta name="description" content="PromoGames is a no-code gamification platform that helps businesses boost marketing with quick games, real rewards, and engaging customer experiences." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.promogames.in" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.promogames.in" />
    <meta property="og:title" content="PromoGames — Quick Games. Real Rewards. | No-Code Gamification Platform" />
    <meta property="og:description" content="PromoGames is a no-code gamification platform that helps businesses boost marketing with quick games, real rewards, and engaging customer experiences." />
    <meta property="og:image" content="https://www.promogames.in/og-image.png" />
    <meta property="og:site_name" content="PromoGames" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PromoGames — Quick Games. Real Rewards. | No-Code Gamification Platform" />
    <meta name="twitter:description" content="PromoGames is a no-code gamification platform that helps businesses boost marketing with quick games, real rewards, and engaging customer experiences." />
    <meta name="twitter:image" content="https://www.promogames.in/og-image.png" />

    <!-- Apple Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PromoGames" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#9210f6" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- DNS Prefetch for common third-party domains -->
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Critical CSS for above-the-fold loading -->
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { margin: 0; padding: 0; background: #07040f; color: #ffffff; font-family: 'DM Sans', sans-serif; }
      #root { min-height: 100dvh; min-height: 100vh; }
    </style>

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PromoGames",
      "url": "https://www.promogames.in",
      "description": "No-code gamification platform for business marketing with quick games and real rewards.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.promogames.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PromoGames",
      "url": "https://www.promogames.in",
      "logo": "https://www.promogames.in/logo.png",
      "sameAs": [
        "https://www.linkedin.com/company/promogames",
        "https://twitter.com/promogames"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
